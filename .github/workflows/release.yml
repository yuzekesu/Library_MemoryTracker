#pragma once
name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          cd code
          zip "../MemoryTracker-${{ github.ref_name }}.zip" .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "MemoryTracker-${{ github.ref_name }}.zip" --title "${{ github.ref_name }}" --generate-notes